# Render Blueprint: one web service (built from the Dockerfile) + one free Postgres.
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: seat-reservation
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: seat-reservation-db
          property: connectionString
      - key: ADMIN_TOKEN
        sync: false          # Render asks for this value when you create the Blueprint
      - key: POOL_MAX
        value: "10"          # free Postgres has a small connection limit

databases:
  - name: seat-reservation-db
    plan: free
    databaseName: seats
    user: seats
